
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тривога! (Simulator) — J-Corp</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    :root {
      --background: #0C131D;
      --map-background: #3D4558;
      --panel: #172231;
      --panel-light: #202D40;
      --text: #FFFFFF;
      --muted: #AAB5C5;
      --accent: #478DFF;
      --border: #34445A;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    header {
      padding: 16px 20px;
      background: #111B29;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    header h1 {
      margin: 0;
      font-size: 21px;
    }

    header small {
      color: var(--muted);
    }

    .layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 14px;
      padding: 14px;
      min-height: calc(100vh - 70px);
    }

    aside {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }

    .panel h2 {
      font-size: 16px;
      margin: 0 0 14px;
    }

    label {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin: 12px 0 6px;
    }

    select, input, button {
      width: 100%;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--panel-light);
      color: white;
      padding: 9px;
      font-size: 14px;
    }

    input[type="color"] {
      height: 40px;
      padding: 3px;
      cursor: pointer;
    }

    input[type="range"] {
      padding: 0;
      accent-color: var(--accent);
    }

    button {
      cursor: pointer;
      background: var(--accent);
      border: none;
      margin-top: 10px;
      font-weight: bold;
    }

    button:hover {
      filter: brightness(1.12);
    }

    .secondary {
      background: #34445A;
    }

    .map-wrap {
      position: relative;
      min-height: 650px;
      height: calc(100vh - 100px);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--map-background);
    }

    #map {
      width: 100%;
      height: 100%;
      background: var(--map-background);
    }

    .map-title {
      position: absolute;
      z-index: 500;
      top: 12px;
      left: 55px;
      background: #0C131DDE;
      padding: 9px 13px;
      border-radius: 7px;
      pointer-events: none;
      font-size: 13px;
    }

    .status {
      color: #70D99A;
      font-size: 12px;
      margin-top: 10px;
    }

    .journal {
      max-height: 190px;
      overflow-y: auto;
      font-size: 13px;
      color: var(--muted);
    }

    .journal-entry {
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }

    .danger {
      color: #FF7777;
    }

    .warning {
      color: #FFD36A;
    }

    @media (max-width: 850px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .map-wrap {
        height: 65vh;
        min-height: 400px;
      }
    }
  </style>
</head>

<body>

<header>
  <div>
    <h1>Тривога! (Simulator)</h1>
    <small>by J-Corp · BETA 0.1</small>
  </div>
  <small>Демонстраційний симулятор</small>
</header>

<div class="layout">

  <aside>

    <section class="panel">
      <h2>Налаштування карти</h2>

      <label for="mapStyle">Стиль карти</label>
      <select id="mapStyle">
        <option value="osm">OpenStreetMap</option>
        <option value="dark">Темна</option>
        <option value="light">Світла</option>
        <option value="satellite">Супутникова</option>
        <option value="none">Без картографічного шару</option>
      </select>

      <label for="mapColor">Колір фону карти</label>
      <input type="color" id="mapColor" value="#3D4558">

      <label for="brightness">Яскравість: <span id="brightnessValue">100%</span></label>
      <input type="range" id="brightness" min="30" max="180" value="100">

      <label for="saturation">Насиченість: <span id="saturationValue">100%</span></label>
      <input type="range" id="saturation" min="0" max="200" value="100">

      <label for="opacity">Прозорість карти: <span id="opacityValue">100%</span></label>
      <input type="range" id="opacity" min="0" max="100" value="100">

      <button id="resetSettings" class="secondary">Скинути оформлення</button>

      <div class="status">Налаштування зберігаються автоматично</div>
    </section>

    <section class="panel">
      <h2>Симуляція подій</h2>

      <label for="eventType">Тип події</label>
      <select id="eventType">
        <option>Повітряна тривога</option>
        <option>Загроза артобстрілу</option>
        <option>Загроза вуличних боїв</option>
        <option>Хімічна загроза</option>
        <option>Радіаційна загроза</option>
        <option>Відбій</option>
      </select>

      <button id="addEvent">Додати подію</button>
      <button id="clearEvents" class="secondary">Очистити журнал</button>
    </section>

    <section class="panel">
      <h2>Журнал подій</h2>
      <div id="journal" class="journal">
        Подій поки немає.
      </div>
    </section>

  </aside>

  <main class="map-wrap">
    <div class="map-title">Карта України · Деморежим</div>
    <div id="map"></div>
  </main>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const DEFAULTS = {
    mapStyle: "osm",
    mapColor: "#3D4558",
    brightness: 100,
    saturation: 100,
    opacity: 100
  };

  const map = L.map("map", {
    center: [49.0, 31.3],
    zoom: 6,
    zoomControl: true
  });

  const styles = {
    osm: "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    dark: "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
    light: "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
    satellite: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
  };

  let tileLayer = null;

  const mapElement = document.getElementById("map");

  function loadSettings() {
    try {
      return {
        ...DEFAULTS,
        ...JSON.parse(localStorage.getItem("jc_map_settings") || "{}")
      };
    } catch {
      return { ...DEFAULTS };
    }
  }

  let settings = loadSettings();

  function saveSettings() {
    localStorage.setItem("jc_map_settings", JSON.stringify(settings));
  }

  function updateMap() {
    if (tileLayer) {
      map.removeLayer(tileLayer);
      tileLayer = null;
    }

    mapElement.style.backgroundColor = settings.mapColor;

    if (settings.mapStyle !== "none") {
      tileLayer = L.tileLayer(styles[settings.mapStyle], {
        attribution: settings.mapStyle === "satellite"
          ? "Tiles © Esri"
          : "&copy; OpenStreetMap contributors",
        opacity: settings.opacity / 100,
        maxZoom: 19
      }).addTo(map);
    }

    const brightness = settings.brightness;
    const saturation = settings.saturation;

    if (tileLayer) {
      tileLayer.getContainer().style.filter =
        `brightness(${brightness}%) saturate(${saturation}%)`;
    }

    map.invalidateSize();
    saveSettings();
  }

  function showSettings() {
    document.getElementById("mapStyle").value = settings.mapStyle;
    document.getElementById("mapColor").value = settings.mapColor;

    document.getElementById("brightness").value = settings.brightness;
    document.getElementById("saturation").value = settings.saturation;
    document.getElementById("opacity").value = settings.opacity;

    document.getElementById("brightnessValue").textContent =
      settings.brightness + "%";

    document.getElementById("saturationValue").textContent =
      settings.saturation + "%";

    document.getElementById("opacityValue").textContent =
      settings.opacity + "%";
  }

  document.getElementById("mapStyle").addEventListener("change", e => {
    settings.mapStyle = e.target.value;
    updateMap();
  });

  document.getElementById("mapColor").addEventListener("input", e => {
    settings.mapColor = e.target.value;
    updateMap();
  });

  document.getElementById("brightness").addEventListener("input", e => {
    settings.brightness = Number(e.target.value);
    showSettings();
    updateMap();
  });

  document.getElementById("saturation").addEventListener("input", e => {
    settings.saturation = Number(e.target.value);
    showSettings();
    updateMap();
  });

  document.getElementById("opacity").addEventListener("input", e => {
    settings.opacity = Number(e.target.value);
    showSettings();
    updateMap();
  });

  document.getElementById("resetSettings").addEventListener("click", () => {
    settings = { ...DEFAULTS };
    showSettings();
    updateMap();
  });

  const journal = document.getElementById("journal");

  document.getElementById("addEvent").addEventListener("click", () => {
    const type = document.getElementById("eventType").value;
    const time = new Date().toLocaleTimeString("uk-UA");

    if (journal.textContent === "Подій поки немає.") {
      journal.innerHTML = "";
    }

    const entry = document.createElement("div");
    entry.className = "journal-entry";

    const title = document.createElement("strong");
    title.textContent = type;

    if (type === "Відбій") {
      title.className = "";
    } else {
      title.className = "danger";
    }

    const timestamp = document.createElement("div");
    timestamp.textContent = time;

    entry.append(title, timestamp);
    journal.prepend(entry);
  });

  document.getElementById("clearEvents").addEventListener("click", () => {
    journal.textContent = "Подій поки немає.";
  });

  showSettings();
  updateMap();
</script>

</body>
</html>
