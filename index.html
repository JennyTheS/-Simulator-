
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тривога! (Simulator) — J-Corp</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root {
  --bg:#0C131D;
  --panel:#172231;
  --panel2:#202D40;
  --text:#fff;
  --muted:#AAB5C5;
  --border:#34445A;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{padding:15px 20px;background:#111B29;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-size:21px;margin:0 0 5px}
small{color:var(--muted)}
.layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:14px;padding:14px}
aside{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px}
.panel h2{font-size:16px;margin:0 0 12px}
label{display:block;color:var(--muted);font-size:13px;margin:11px 0 6px}
select,input,button{width:100%;padding:9px;border:1px solid var(--border);border-radius:7px;background:var(--panel2);color:white}
input[type=color]{height:40px;padding:3px}
input[type=range]{padding:0;accent-color:#478DFF}
button{cursor:pointer;background:#478DFF;border:0;margin-top:10px;font-weight:bold}
button.secondary{background:#34445A}
.map-wrap{height:calc(100vh - 95px);min-height:500px;position:relative;border-radius:10px;overflow:hidden;background:#3D4558}
#map{width:100%;height:100%;background:#3D4558}
.map-title{position:absolute;z-index:500;top:12px;left:55px;background:#0C131DDD;padding:9px 12px;border-radius:7px;pointer-events:none}
.status{font-size:12px;line-height:1.5;color:#70D99A;margin-top:10px}
.status.error{color:#FF8888}
.value{float:right;color:white}
.journal{max-height:170px;overflow:auto;font-size:13px;color:var(--muted)}
.journal-entry{padding:8px 0;border-bottom:1px solid var(--border)}
.danger{color:#FF7777}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#172231;color:white}
@media(max-width:850px){
 .layout{grid-template-columns:1fr}
 .map-wrap{height:65vh;min-height:400px}
}
</style>
</head>
<body>

<header>
  <div>
    <h1>Тривога! (Simulator)</h1>
    <small>by J-Corp · BETA 0.2</small>
  </div>
  <small>Демонстраційний симулятор</small>
</header>

<div class="layout">
<aside>

<section class="panel">
<h2>Налаштування карти</h2>

<label>Стиль карти</label>
<select id="mapStyle">
<option value="osm">OpenStreetMap</option>
<option value="dark">Темна</option>
<option value="light">Світла</option>
<option value="satellite">Супутникова</option>
<option value="none">Без підкладки</option>
</select>

<label>Фон карти</label>
<input type="color" id="mapColor" value="#3D4558">

<label>Заливка областей</label>
<input type="color" id="regionFill" value="#3D4558">

<label>Контури областей</label>
<input type="color" id="borderColor" value="#FFFFFF">

<label>Товщина контурів <span class="value" id="widthValue">1.5 px</span></label>
<input type="range" id="borderWidth" min="0.5" max="5" step="0.5" value="1.5">

<label>Прозорість областей <span class="value" id="fillValue">35%</span></label>
<input type="range" id="fillOpacity" min="0" max="100" value="35">

<label>Прозорість підкладки <span class="value" id="tileValue">100%</span></label>
<input type="range" id="tileOpacity" min="0" max="100" value="100">

<label>Яскравість <span class="value" id="brightnessValue">100%</span></label>
<input type="range" id="brightness" min="30" max="180" value="100">

<label>Насиченість <span class="value" id="saturationValue">100%</span></label>
<input type="range" id="saturation" min="0" max="200" value="100">

<button class="secondary" id="reset">Скинути налаштування</button>
<div class="status" id="mapStatus">Завантаження карти…</div>
</section>

<section class="panel">
<h2>Симуляція подій</h2>
<label>Тип події</label>
<select id="eventType">
<option>Повітряна тривога</option>
<option>Загроза артобстрілу</option>
<option>Загроза вуличних боїв</option>
<option>Хімічна загроза</option>
<option>Радіаційна загроза</option>
<option>Відбій</option>
</select>
<button id="addEvent">Додати подію</button>
<button class="secondary" id="clearEvents">Очистити журнал</button>
</section>

<section class="panel">
<h2>Журнал подій</h2>
<div class="journal" id="journal">Подій поки немає.</div>
</section>

</aside>

<main class="map-wrap">
<div class="map-title">Україна · адміністративні межі</div>
<div id="map"></div>
</main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
"use strict";

const DEFAULTS = {
 mapStyle:"osm",
 mapColor:"#3D4558",
 regionFill:"#3D4558",
 borderColor:"#FFFFFF",
 borderWidth:1.5,
 fillOpacity:35,
 tileOpacity:100,
 brightness:100,
 saturation:100
};

const TILE_URLS = {
 osm:"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
 dark:"https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
 light:"https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
 satellite:"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
};

const status = document.getElementById("mapStatus");
const mapElement = document.getElementById("map");

if (!window.L) {
 status.textContent = "Leaflet не завантажився. Перевір інтернет-з'єднання.";
 status.className = "status error";
 return;
}

const map = L.map("map", {
 center:[48.8,31.2],
 zoom:6,
 zoomControl:true
});

let settings;
try {
 settings = {...DEFAULTS,...JSON.parse(localStorage.getItem("jc_map_settings_v2") || "{}")};
} catch {
 settings = {...DEFAULTS};
}

let tiles = null;
let oblasts = null;

function save() {
 try {
  localStorage.setItem("jc_map_settings_v2",JSON.stringify(settings));
 } catch {}
}

function setStatus(message,error=false) {
 status.textContent = message;
 status.className = error ? "status error" : "status";
}

function regionStyle() {
 return {
  color:settings.borderColor,
  weight:Number(settings.borderWidth),
  opacity:1,
  fillColor:settings.regionFill,
  fillOpacity:Number(settings.fillOpacity)/100
 };
}

function updateTiles() {
 if (tiles) {
  map.removeLayer(tiles);
  tiles = null;
 }

 mapElement.style.backgroundColor = settings.mapColor;

 if (settings.mapStyle !== "none") {
  tiles = L.tileLayer(TILE_URLS[settings.mapStyle], {
   maxZoom:19,
   opacity:Number(settings.tileOpacity)/100,
   attribution:settings.mapStyle === "satellite"
    ? "Tiles © Esri"
    : "© OpenStreetMap contributors"
  }).addTo(map);

  tiles.on("tileerror",() => {
   setStatus("Не вдалося завантажити картографічну підкладку. Контури залишаються окремим шаром.",true);
  });
 }

 const pane = map.getPane("tilePane");
 pane.style.filter =
  `brightness(${settings.brightness}%) saturate(${settings.saturation}%)`;
}

function updateRegions() {
 if (oblasts) oblasts.setStyle(regionStyle());
}

function updateLabels() {
 document.getElementById("widthValue").textContent = settings.borderWidth+" px";
 document.getElementById("fillValue").textContent = settings.fillOpacity+"%";
 document.getElementById("tileValue").textContent = settings.tileOpacity+"%";
 document.getElementById("brightnessValue").textContent = settings.brightness+"%";
 document.getElementById("saturationValue").textContent = settings.saturation+"%";
}

function showSettings() {
 Object.keys(DEFAULTS).forEach(key => {
  document.getElementById(key).value = settings[key];
 });
 updateLabels();
}

function refresh() {
 updateTiles();
 updateRegions();
 updateLabels();
 save();
 map.invalidateSize();
}

Object.keys(DEFAULTS).forEach(key => {
 document.getElementById(key).addEventListener("input",event => {
  const numeric = [
   "borderWidth","fillOpacity","tileOpacity","brightness","saturation"
  ].includes(key);

  settings[key] = numeric ? Number(event.target.value) : event.target.value;

  if (["mapStyle","mapColor","tileOpacity","brightness","saturation"].includes(key)) {
   updateTiles();
  }

  updateRegions();
  updateLabels();
  save();
 });
});

document.getElementById("reset").addEventListener("click",() => {
 settings = {...DEFAULTS};
 showSettings();
 refresh();
});

showSettings();
updateTiles();

const GEOJSON_URL =
 "https://cdn.jsdelivr.net/gh/romansverdan/Ukraine-Map@main/ukraine-adm-regions.json";

fetch(GEOJSON_URL)
 .then(response => {
  if (!response.ok) throw new Error("HTTP "+response.status);
  return response.json();
 })
 .then(data => {
  if (!data.features || !data.features.length) {
   throw new Error("GeoJSON не містить географічних об'єктів");
  }

  oblasts = L.geoJSON(data,{
   style:regionStyle,
   onEachFeature:(feature,layer) => {
    const props = feature.properties || {};
    const name = props.UA_NAME || props.NAME_1 || "Область";

    layer.bindTooltip(name,{sticky:true});
    layer.bindPopup("<strong>"+String(name).replace(/[&<>"]/g,c => ({
     "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"
    }[c]))+"</strong>");
   }
  }).addTo(map);

  map.fitBounds(oblasts.getBounds(),{padding:[18,18]});

  setStatus(
   "Завантажено "+data.features.length+
   " адміністративних територій. Натискай на область, щоб побачити назву."
  );
 })
 .catch(error => {
  console.error(error);
  setStatus("Не вдалося завантажити GeoJSON. Перевір інтернет або доступність джерела.",true);
 });

const journal = document.getElementById("journal");

document.getElementById("addEvent").addEventListener("click",() => {
 const type = document.getElementById("eventType").value;

 if (journal.textContent.trim() === "Подій поки немає.") {
  journal.textContent = "";
 }

 const entry = document.createElement("div");
 entry.className = "journal-entry";

 const title = document.createElement("strong");
 title.textContent = type;
 if (type !== "Відбій") title.className = "danger";

 const time = document.createElement("div");
 time.textContent = new Date().toLocaleTimeString("uk-UA");

 entry.append(title,time);
 journal.prepend(entry);
});

document.getElementById("clearEvents").addEventListener("click",() => {
 journal.textContent = "Подій поки немає.";
});

window.addEventListener("resize",() => map.invalidateSize());
setTimeout(() => map.invalidateSize(),300);

})();
</script>
</body>
</html>
